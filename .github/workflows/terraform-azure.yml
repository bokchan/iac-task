name: Terraform Azure Guardrails

on:
  push:
    paths:
      - "azure-infra/**"
      - ".github/workflows/terraform-azure.yml"

  pull_request:
    paths:
      - "azure-infra/**"
      - ".github/workflows/terraform-azure.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (validation mode)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  plan:
    name: Terraform Plan (Dev)
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '') }}
    defaults:
      run:
        working-directory: azure-infra
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -var-file=dev.tfvars -var="deploy_container_app=true" -out=tfplan

      - name: Render plan output
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-azure-dev-plan
          path: azure-infra/tfplan.txt
